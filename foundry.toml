[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
evm_version = "cancun"
fs_permissions = [
    { access = "read-write", path = "./test-vectors" },
    { access = "read-write", path = "./docs" },
]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@account-abstraction/=lib/account-abstraction/contracts/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
bnb = "${BNB_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
monad = "${MONAD_RPC_URL}"
apechain = "${APECHAIN_RPC_URL}"

[invariant]
runs = 16
depth = 8
fail_on_revert = false
