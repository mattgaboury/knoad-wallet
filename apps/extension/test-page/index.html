<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KNOAD test page</title>
  </head>
  <body>
    <h1>KNOAD test page</h1>
    <button id="connect" type="button">Connect</button>
    <button id="sign" type="button">personal_sign</button>
    <pre id="out"></pre>
    <script>
      const out = document.getElementById("out");
      const ethereum = () => window.ethereum;
      document.getElementById("connect").onclick = async () => {
        try {
          const accounts = await ethereum().request({ method: "eth_requestAccounts" });
          out.textContent = JSON.stringify(accounts);
        } catch (error) {
          out.textContent = error.message;
        }
      };
      document.getElementById("sign").onclick = async () => {
        try {
          const accounts = await ethereum().request({ method: "eth_accounts" });
          const signature = await ethereum().request({ method: "personal_sign", params: ["0x6869", accounts[0]] });
          out.textContent = signature;
        } catch (error) {
          out.textContent = error.message;
        }
      };
    </script>
  </body>
</html>
